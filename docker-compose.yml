services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        VITE_API_URL: /api
    ports: 
      - "8080:8080"
    container_name: clothing-shop-frontend
    expose:
      - "8080"
    networks:
      - services-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: clothing-shop-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - services-network
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    container_name: clothing-shop-backend
    ports:
      - "3300:3300"
    env_file:
      - ../backend/.env
    environment:
      - PORT=3300
    networks:
      - services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3300) + '/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tryon-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tryon-service
    container_name: clothing-shop-tryon-service
    ports:
      - "8000"
    env_file:
      - ../tryon-service/.env
    environment:
      - BACKEND_URL=http://backend:3300
    volumes:
      - ../tryon-service/service-account.json:/app/tryon-service/service-account.json:ro
    networks:
      - services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client, os, sys; c=http.client.HTTPConnection('127.0.0.1', int(os.getenv('PORT', '8000')), timeout=5); c.request('GET', '/docs'); sys.exit(0 if c.getresponse().status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  services-network:
    driver: bridge

volumes:
  postgres_data:
